<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="container" id="adicionar">

<h2>Adicionar novo produto</h2>

<p>Preencha os campos para registar um novo produto.</p>

<form >
<div class="campo">

<label for="nome">Nome do produto:</label>

<input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" required>
</div>

<div class="campo">

<label for="preco">Preço:</label>

<input type="number" id="preco" name="preco" placeholder="Digite o preço" min="0" step="0.01"required>
</div>

<div class="campo">
<label for="quantidade">Quantidade:</label>
<input
type="number"
id="quantidade"
name="quantidade"
placeholder="Digite a quantidade"
min="0"
required>
</div>
<div class="campo">
<label for="descricao">Descrição:</label>
<textarea
id="descricao"
name="descricao"
rows="4"
placeholder="Descreva o produto..."
></textarea>

</div>

<button type="submit">Salvar Produto</button>
</form>
</section>
</main>

<footer>

<p>Gerenciador de Estoque © 2026</p>

</footer>

</body>
</body>
</html>
